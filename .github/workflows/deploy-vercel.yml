# 푸시 시 Next.js를 Vercel 프로덕션에 배포합니다.
# GitHub → 저장소 → Settings → Secrets and variables → Actions 에 아래 시크릿을 넣으세요:
#   VERCEL_TOKEN      https://vercel.com/account/tokens
#   VERCEL_ORG_ID     Vercel 프로젝트 → Settings → General
#   VERCEL_PROJECT_ID 동일
#
# Vercel 대시보드에서 같은 저장소를 "Git 연동"으로 이미 연결했다면 중복 배포되므로,
# 그 경우 이 워크플로는 비활성화하거나 Vercel 쪽 자동 배포를 끄세요.

name: Deploy frontend (Vercel)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
