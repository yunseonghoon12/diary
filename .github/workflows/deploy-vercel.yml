# 푸시 시 Next.js를 Vercel 프로덕션에 배포합니다.
# GitHub → 저장소 → Settings → Secrets and variables → Actions
#   탭은 반드시 **Secrets** (Variables만 넣으면 secrets.XXX 가 비어 있음)
#   VERCEL_TOKEN        https://vercel.com/account/tokens
#   VERCEL_ORG_ID       Vercel 프로젝트 → Settings → General
#   VERCEL_PROJECT_ID   같은 화면의 Project ID
#
# 로컬에서 한 번 `npx vercel link` 후 `.vercel/project.json`의 orgId·projectId를 복사해도 됩니다.
#
# Vercel 대시보드에서 같은 저장소를 Git 연동으로 이미 쓰면 배포가 두 번 갈 수 있으니,
# 그중 하나는 끄거나 이 워크플로를 비활성화하세요.

name: Deploy frontend (Vercel)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel repository secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets 가 비어 있거나 없습니다:$missing"
            echo "저장소 → Settings → Secrets and variables → **Actions** → **Secrets** → New repository secret"
            echo "이름(대소문자 동일): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            echo "Variables 탭에만 있으면 Secrets 탭에도 각각 추가해야 합니다."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
